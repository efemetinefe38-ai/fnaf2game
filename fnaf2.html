<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FNAF 2 - Animated Mask & Camera</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #game-container {
    position: relative;
    width: 1000px;
    height: 600px;
    background: #000;
    border: 3px solid #333;
    overflow: hidden;
    touch-action: none;
  }
  canvas { width: 100%; height: 100%; display: block; }

  /* HUD */
  .hud-top-left {
    position: absolute; top: 12px; left: 15px;
    display: flex; flex-direction: column; gap: 4px;
    pointer-events: none; z-index: 10;
  }
  .flashlight-hud { font-size: 13px; font-weight: bold; letter-spacing: 1px; color: #fff; }
  .battery-bar {
    display: flex; gap: 3px; border: 2px solid #fff;
    padding: 2px; width: 85px; height: 15px; background: #111;
  }
  .battery-segment { flex: 1; background: #fff; }

  .hud-top-right {
    position: absolute; top: 12px; right: 15px; text-align: right;
    pointer-events: none; z-index: 10;
  }
  .night-text { font-size: 18px; font-weight: bold; color: #fff; }
  .time-text { font-size: 24px; font-weight: bold; color: #fff; margin-top: 2px; }

  /* CONTROLS */
  .control-btn {
    position: absolute;
    background: rgba(35, 45, 60, 0.9);
    border: 2px solid #6688aa;
    color: #fff;
    font-weight: bold;
    font-family: monospace;
    cursor: pointer;
    z-index: 10;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .control-btn:active, .control-btn.active {
    background: #ffffaa !important;
    color: #000 !important;
    box-shadow: 0 0 20px #ffffaa;
  }

  #btn-flash-center {
    top: 12px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; font-size: 14px; border-color: #ffff88;
  }

  #btn-left-vent {
    top: 260px; left: 10px; width: 55px; height: 120px;
    writing-mode: vertical-rl; text-orientation: upright; font-size: 13px;
  }

  #btn-right-vent {
    top: 260px; right: 10px; width: 55px; height: 120px;
    writing-mode: vertical-rl; text-orientation: upright; font-size: 13px;
  }

  /* BARS */
  .bottom-bars {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 48px;
    display: flex; justify-content: space-between; padding: 4px 10px; gap: 10px;
    z-index: 15;
  }
  .hover-bar {
    flex: 1; height: 40px; border: 2px solid #666; border-radius: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 14px; letter-spacing: 2px;
  }
  #bar-mask {
    background: repeating-linear-gradient(-45deg, #5c2232, #5c2232 10px, #a3455f 10px, #a3455f 20px);
    border-color: #d16281; color: #ffd1dc;
  }
  #bar-camera {
    background: repeating-linear-gradient(-45deg, #2a2a35, #2a2a35 10px, #555565 10px, #555565 20px);
    border-color: #88a; color: #fff;
  }

  /* GAME OVER */
  #game-over-screen {
    display: none; position: absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.92); z-index: 100;
    flex-direction: column; justify-content: center; align-items: center;
  }
  #btn-restart {
    margin-top: 20px; padding: 12px 28px; font-size: 18px;
    background: #e00; color: #fff; border: none; cursor: pointer; font-weight: bold; border-radius: 6px;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="1000" height="600"></canvas>

  <div class="hud-top-left">
    <div class="flashlight-hud">flashlight</div>
    <div class="battery-bar" id="battery-bar">
      <div class="battery-segment"></div>
      <div class="battery-segment"></div>
      <div class="battery-segment"></div>
      <div class="battery-segment"></div>
    </div>
  </div>

  <div class="hud-top-right">
    <div class="night-text">Night 1</div>
    <div class="time-text" id="time-text">12 AM</div>
  </div>

  <button class="control-btn" id="btn-flash-center">🔦 ORTA FENER (BASILI TUT)</button>
  <button class="control-btn" id="btn-left-vent">SOL VENT</button>
  <button class="control-btn" id="btn-right-vent">SAĞ VENT</button>

  <div class="bottom-bars">
    <div class="hover-bar" id="bar-mask">MASKE TAK / ÇIKAR</div>
    <div class="hover-bar" id="bar-camera">MONİTÖR (KAMERA)</div>
  </div>

  <div id="game-over-screen">
    <h1 id="go-title" style="color:#f00; font-size: 52px;">GAME OVER</h1>
    <p id="go-reason" style="font-size: 20px; margin-top: 10px; color: #ccc;"></p>
    <button id="btn-restart" onclick="location.reload()">YENİDEN BAŞLAT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let time = 12;
let battery = 100;
let musicBox = 100;

let maskProgress = 0;
let maskTarget = 0;
let camProgress = 0;
let camTarget = 0;

let currentCam = "CAM11";

let isFlashlightOn = false;
let isLeftVentLight = false;
let isRightVentLight = false;

let hallwayEnemy = null; 
let leftVentEnemy = false; 
let rightVentEnemy = false; 

let threatTimer = 0;
let fanAngle = 0;
let isJumpscaring = false;
let jumpscareWho = "";
let jumpscareFrame = 0;
let gameOver = false;

setInterval(() => {
  if (gameOver) return;
  if (time === 12) time = 1; else time++;
  if (time === 6) {
    gameOver = true;
    document.getElementById('go-title').innerText = "🎉 SAAT 6 AM OLDU!";
    document.getElementById('go-title').style.color = "#0f0";
    document.getElementById('go-reason').innerText = "Geceyi başardın!";
    document.getElementById('game-over-screen').style.display = 'flex';
  } else {
    document.getElementById('time-text').innerText = time + " AM";
  }
}, 22000);

setInterval(() => {
  if (gameOver || isJumpscaring) return;
  if (!hallwayEnemy && !leftVentEnemy && !rightVentEnemy) {
    let r = Math.random();
    if (r < 0.4) {
      hallwayEnemy = Math.random() < 0.5 ? 'foxy' : 'bonnie';
    } else if (r < 0.7) {
      leftVentEnemy = true;
    } else {
      rightVentEnemy = true;
    }
    threatTimer = 0;
  }
}, 8000);

function gameLoop() {
  updateLogic();
  render();
  requestAnimationFrame(gameLoop);
}

function updateLogic() {
  if (gameOver) return;

  fanAngle += 0.25;

  if (maskProgress < maskTarget) {
    maskProgress = Math.min(1, maskProgress + 0.1);
  } else if (maskProgress > maskTarget) {
    maskProgress = Math.max(0, maskProgress - 0.1);
  }

  if (camProgress < camTarget) {
    camProgress = Math.min(1, camProgress + 0.1);
  } else if (camProgress > camTarget) {
    camProgress = Math.max(0, camProgress - 0.1);
  }

  if (camProgress < 0.8) {
    musicBox -= 0.06;
  }
  if (musicBox <= 0 && !isJumpscaring) {
    startJumpscare("PUPPET", "Müzik kutusu bitti ve Puppet saldırdı!");
  }

  if (isFlashlightOn && battery > 0 && maskProgress === 0 && camProgress === 0) {
    battery -= 0.08;
    if (battery < 0) battery = 0;
    updateBatteryUI();
  }

  if (hallwayEnemy || leftVentEnemy || rightVentEnemy) {
    threatTimer++;

    if (leftVentEnemy) {
      if (maskProgress > 0.8) {
        if (threatTimer > 90) { leftVentEnemy = false; threatTimer = 0; }
      } else if (threatTimer > 350) {
        startJumpscare("TOY BONNIE", "Sol havalandırmadan saldırdı!");
      }
    }

    if (rightVentEnemy) {
      if (maskProgress > 0.8) {
        if (threatTimer > 90) { rightVentEnemy = false; threatTimer = 0; }
      } else if (threatTimer > 350) {
        startJumpscare("TOY CHICA", "Sağ havalandırmadan saldırdı!");
      }
    }

    if (hallwayEnemy) {
      if (hallwayEnemy === 'foxy') {
        if (isFlashlightOn && battery > 0) {
          if (threatTimer > 40) { hallwayEnemy = null; threatTimer = 0; }
        } else if (threatTimer > 380) {
          startJumpscare("FOXY", "Foxy koridordan üzerine fırladı!");
        }
      } else {
        if (maskProgress > 0.8) {
          if (threatTimer > 100) { hallwayEnemy = null; threatTimer = 0; }
        } else if (threatTimer > 320) {
          startJumpscare("BONNIE", "Ofise giren Bonnie seni yakaladı!");
        }
      }
    }
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (isJumpscaring) {
    renderJumpscare();
    return;
  }

  renderOffice();

  if (camProgress > 0) {
    ctx.save();
    let camY = canvas.height * (1 - camProgress);
    ctx.translate(0, camY);
    renderCamera();
    ctx.restore();
  }

  if (maskProgress > 0) {
    renderMaskOverlay();
  }
}

function renderOffice() {
  ctx.fillStyle = "#1e222d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#141720"; ctx.lineWidth = 8;
  for(let x = 0; x < canvas.width; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 410); ctx.stroke();
  }

  ctx.fillStyle = "#14161f";
  ctx.fillRect(0, 410, canvas.width, 190);
  ctx.strokeStyle = "#3a4254"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 410); ctx.lineTo(canvas.width, 410); ctx.stroke();

  ctx.fillStyle = "#8b2626";
  ctx.fillRect(200, 100, 90, 110);
  ctx.fillStyle = "#ffffaa"; ctx.font = "bold 11px sans-serif";
  ctx.fillText("CELEBRATE!", 206, 120);

  ctx.fillStyle = "#08090d";
  ctx.fillRect(340, 70, 320, 340);
  ctx.strokeStyle = "#4a5366"; ctx.lineWidth = 6;
  ctx.strokeRect(340, 70, 320, 340);

  ctx.fillStyle = "#08090d";
  ctx.fillRect(20, 230, 140, 180);
  ctx.strokeStyle = "#5a6378"; ctx.lineWidth = 6;
  ctx.strokeRect(20, 230, 140, 180);

  ctx.fillStyle = "#08090d";
  ctx.fillRect(840, 230, 140, 180);
  ctx.strokeStyle = "#5a6378"; ctx.lineWidth = 6;
  ctx.strokeRect(840, 230, 140, 180);

  if (maskProgress === 0 && camProgress === 0) {
    if (isLeftVentLight) {
      ctx.fillStyle = "rgba(255, 255, 190, 0.95)";
      ctx.fillRect(23, 233, 134, 174);
      if (leftVentEnemy) {
        ctx.fillStyle = "#2288cc";
        ctx.beginPath(); ctx.arc(90, 320, 45, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(70, 240, 14, 45); ctx.fillRect(96, 240, 14, 45);
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(78, 310, 12, 0, Math.PI*2); ctx.arc(102, 310, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(78, 310, 5, 0, Math.PI*2); ctx.arc(102, 310, 5, 0, Math.PI*2); ctx.fill();
      }
    }

    if (isRightVentLight) {
      ctx.fillStyle = "rgba(255, 255, 190, 0.95)";
      ctx.fillRect(843, 233, 134, 174);
      if (rightVentEnemy) {
        ctx.fillStyle = "#eec800";
        ctx.beginPath(); ctx.arc(910, 320, 45, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ff6600"; ctx.fillRect(895, 330, 30, 15);
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(895, 310, 12, 0, Math.PI*2); ctx.arc(925, 310, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(895, 310, 5, 0, Math.PI*2); ctx.arc(925, 310, 5, 0, Math.PI*2); ctx.fill();
      }
    }

    if (isFlashlightOn && battery > 0) {
      ctx.fillStyle = "rgba(255, 255, 210, 0.92)";
      ctx.fillRect(343, 73, 314, 334);
      let gradC = ctx.createRadialGradient(500, 240, 20, 500, 240, 250);
      gradC.addColorStop(0, 'rgba(255,255,255,1)');
      gradC.addColorStop(0.6, 'rgba(255,255,180,0.6)');
      gradC.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradC; ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (hallwayEnemy) {
        if (hallwayEnemy === 'foxy') {
          ctx.fillStyle = "#aa2222"; ctx.beginPath(); ctx.arc(500, 220, 52, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = "#000"; ctx.fillRect(510, 205, 22, 18);
        } else {
          ctx.fillStyle = "#3333aa"; ctx.beginPath(); ctx.arc(500, 220, 55, 0, Math.PI*2); ctx.fill();
          ctx.fillRect(470, 120, 16, 65); ctx.fillRect(514, 120, 16, 65);
        }
      }
    }
  }

  ctx.fillStyle = "#2c221e"; ctx.fillRect(160, 420, 680, 180);
  ctx.fillStyle = "#4a3b32"; ctx.fillRect(140, 410, 720, 20);

  ctx.save();
  ctx.translate(730, 355);
  ctx.fillStyle = "#222"; ctx.fillRect(-6, 30, 12, 35);
  ctx.rotate(fanAngle);
  ctx.fillStyle = "#778899";
  ctx.fillRect(-30, -5, 60, 10); ctx.fillRect(-5, -30, 10, 60);
  ctx.restore();
}

function renderCamera() {
  ctx.fillStyle = "#05050d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`;
    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 3, 3);
  }

  ctx.fillStyle = "#222"; ctx.fillRect(0, 0, canvas.width, 15);

  ctx.fillStyle = "#0088ff"; ctx.font = "bold 22px Courier";
  ctx.fillText("[" + currentCam + "]", 40, 50);

  if (currentCam === "CAM11") {
    ctx.fillStyle = "#fff"; ctx.font = "bold 16px Courier";
    ctx.fillText("PRIZE CORNER - PUPPET", 40, 80);

    ctx.strokeStyle = "#0088ff"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(500, 290, 85, 0, Math.PI*2); ctx.stroke();
    
    ctx.fillStyle = "#0088ff";
    ctx.beginPath(); ctx.arc(500, 290, Math.max(0, (musicBox/100)*80), 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = "#fff"; ctx.font = "bold 18px Courier"; ctx.textAlign = "center";
    ctx.fillText(`MÜZİK KUTUSU: %${Math.floor(musicBox)}`, 500, 290);
    ctx.fillText("KURMAK İÇİN TIKLA / BASILI TUT", 500, 420);
    ctx.textAlign = "left";
  } else {
    ctx.fillStyle = "#aaa"; ctx.font = "bold 20px Courier";
    ctx.fillText("Kamera görüntüsü aktarılıyor...", 340, 290);
  }

  ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(710, 310, 260, 250);
  ctx.strokeStyle = "#556"; ctx.strokeRect(710, 310, 260, 250);

  const cams = [
    {id: "CAM11", x: 810, y: 340},
    {id: "CAM01", x: 740, y: 400},
    {id: "CAM02", x: 880, y: 400},
    {id: "CAM03", x: 810, y: 470}
  ];

  cams.forEach(c => {
    ctx.fillStyle = currentCam === c.id ? "#00ff00" : "#333";
    ctx.fillRect(c.x, c.y, 65, 32);
    ctx.fillStyle = currentCam === c.id ? "#000" : "#fff";
    ctx.font = "bold 12px Courier";
    ctx.fillText(c.id, c.x + 8, c.y + 20);
  });
}

function renderMaskOverlay() {
  ctx.save();
  let maskY = -canvas.height * (1 - maskProgress);
  ctx.translate(0, maskY);

  ctx.fillStyle = "rgba(25, 12, 6, 0.94)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.ellipse(330, 280, 135, 90, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(670, 280, 135, 90, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.strokeStyle = "#1b0a04"; ctx.lineWidth = 40;
  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  ctx.restore();
}

function startJumpscare(who, reason) {
  isJumpscaring = true;
  jumpscareWho = who;
  jumpscareFrame = 0;
  
  let jsInterval = setInterval(() => {
    jumpscareFrame++;
    if (jumpscareFrame > 30) {
      clearInterval(jsInterval);
      gameOver = true;
      document.getElementById('go-title').innerText = "😱 " + jumpscareWho + " JUMPSCARE!";
      document.getElementById('go-reason').innerText = reason;
      document.getElementById('game-over-screen').style.display = 'flex';
    }
  }, 40);
}

function renderJumpscare() {
  let shakeX = (Math.random() - 0.5) * 35;
  let shakeY = (Math.random() - 0.5) * 35;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.fillStyle = jumpscareFrame % 2 === 0 ? "#b00" : "#000";
  ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);

  let scale = 1 + (jumpscareFrame * 0.1);
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(scale, scale);

  ctx.fillStyle = jumpscareWho === 'PUPPET' ? '#eee' : '#700';
  ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(-40, -30, 28, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(40, -30, 28, 0, Math.PI*2); ctx.fill();
  
  ctx.fillStyle = "#f00";
  ctx.beginPath(); ctx.arc(-40, -30, 9, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(40, -30, 9, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = "#000"; ctx.fillRect(-55, 20, 110, 50);
  ctx.fillStyle = "#fff";
  for(let i = -50; i < 50; i += 15) {
    ctx.beginPath(); ctx.moveTo(i, 20); ctx.lineTo(i+7, 38); ctx.lineTo(i+14, 20); ctx.fill();
  }

  ctx.restore();
}

function updateBatteryUI() {
  let segs = document.getElementById('battery-bar').children;
  let count = Math.ceil(battery / 25);
  for (let i = 0; i < 4; i++) segs[i].style.opacity = i < count ? "1" : "0.1";
}

function bindLightButton(btn, setLight) {
  const start = (e) => { e.preventDefault(); setLight(true); btn.classList.add('active'); };
  const end = (e) => { e.preventDefault(); setLight(false); btn.classList.remove('active'); };

  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointerleave', end);
  btn.addEventListener('pointercancel', end);
}

bindLightButton(document.getElementById('btn-flash-center'), (v) => {
  if (maskProgress === 0 && camProgress === 0) isFlashlightOn = v;
});
bindLightButton(document.getElementById('btn-left-vent'), (v) => isLeftVentLight = v);
bindLightButton(document.getElementById('btn-right-vent'), (v) => isRightVentLight = v);

document.getElementById('bar-mask').addEventListener('click', () => {
  if (camTarget > 0 || gameOver) return;
  maskTarget = maskTarget === 0 ? 1 : 0;
});

document.getElementById('bar-camera').addEventListener('click', () => {
  if (maskTarget > 0 || gameOver) return;
  camTarget = camTarget === 0 ? 1 : 0;
});

canvas.addEventListener('pointerdown', (e) => {
  if (gameOver || camProgress < 0.9) return;
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (canvas.width / rect.width);
  let y = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (x > 710 && y > 310) {
    if (x > 810 && x < 875 && y > 340 && y < 372) currentCam = "CAM11";
    if (x > 740 && x < 805 && y > 400 && y < 432) currentCam = "CAM01";
    if (x > 880 && x < 945 && y > 400 && y < 432) currentCamN = "CAM02"; // Fix typo reference safely
    if (x > 880 && x < 945 && y > 400 && y < 432) currentCam = "CAM02";
    if (x > 810 && x < 875 && y > 470 && y < 502) currentCam = "CAM03";
  }
  if (currentCam === "CAM11" && x > 415 && x < 585 && y > 205 && y < 375) {
    musicBox = Math.min(100, musicBox + 25);
  }
});

window.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (e.code === 'ControlLeft' || e.key === 'f' || e.key === 'F') {
    if (maskProgress === 0 && camProgress === 0) isFlashlightOn = true;
  }
  if (e.code === 'Space') {
    if (camTarget === 0) maskTarget = maskTarget === 0 ? 1 : 0;
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ControlLeft' || e.key === 'f' || e.key === 'F') isFlashlightOn = false;
});

requestAnimationFrame(gameLoop);
</script>
</body>
</html>

  /* CONTROLS */
  .control-btn {
    position: absolute;
    background: rgba(35, 45, 60, 0.9);
    border: 2px solid #6688aa;
    color: #fff;
    font-weight: bold;
    font-family: monospace;
    cursor: pointer;
    z-index: 10;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .control-btn:active, .control-btn.active {
    background: #ffffaa !important;
    color: #000 !important;
    box-shadow: 0 0 20px #ffffaa;
  }

  #btn-flash-center {
    top: 12px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; font-size: 14px; border-color: #ffff88;
  }

  #btn-left-vent {
    top: 260px; left: 10px; width: 55px; height: 120px;
    writing-mode: vertical-rl; text-orientation: upright; font-size: 13px;
  }

  #btn-right-vent {
    top: 260px; right: 10px; width: 55px; height: 120px;
    writing-mode: vertical-rl; text-orientation: upright; font-size: 13px;
  }

  /* BARS */
  .bottom-bars {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 48px;
    display: flex; justify-content: space-between; padding: 4px 10px; gap: 10px;
    z-index: 15;
  }
  .hover-bar {
    flex: 1; height: 40px; border: 2px solid #666; border-radius: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 14px; letter-spacing: 2px;
  }
  #bar-mask {
    background: repeating-linear-gradient(-45deg, #5c2232, #5c2232 10px, #a3455f 10px, #a3455f 20px);
    border-color: #d16281; color: #ffd1dc;
  }
  #bar-camera {
    background: repeating-linear-gradient(-45deg, #2a2a35, #2a2a35 10px, #555565 10px, #555565 20px);
    border-color: #88a; color: #fff;
  }

  /* GAME OVER */
  #game-over-screen {
    display: none; position: absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.92); z-index: 100;
    flex-direction: column; justify-content: center; align-items: center;
  }
  #btn-restart {
    margin-top: 20px; padding: 12px 28px; font-size: 18px;
    background: #e00; color: #fff; border: none; cursor: pointer; font-weight: bold; border-radius: 6px;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="1000" height="600"></canvas>

  <div class="hud-top-left">
    <div class="flashlight-hud">flashlight</div>
    <div class="battery-bar" id="battery-bar">
      <div class="battery-segment"></div>
      <div class="battery-segment"></div>
      <div class="battery-segment"></div>
      <div class="battery-segment"></div>
    </div>
  </div>

  <div class="hud-top-right">
    <div class="night-text">Night 1</div>
    <div class="time-text" id="time-text">12 AM</div>
  </div>

  <button class="control-btn" id="btn-flash-center">🔦 ORTA FENER (BASILI TUT)</button>
  <button class="control-btn" id="btn-left-vent">SOL VENT</button>
  <button class="control-btn" id="btn-right-vent">SAĞ VENT</button>

  <div class="bottom-bars">
    <div class="hover-bar" id="bar-mask">MASKE TAK / ÇIKAR</div>
    <div class="hover-bar" id="bar-camera">MONİTÖR (KAMERA)</div>
  </div>

  <div id="game-over-screen">
    <h1 id="go-title" style="color:#f00; font-size: 52px;">GAME OVER</h1>
    <p id="go-reason" style="font-size: 20px; margin-top: 10px; color: #ccc;"></p>
    <button id="btn-restart" onclick="location.reload()">YENİDEN BAŞLAT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let time = 12;
let battery = 100;
let musicBox = 100;

let maskProgress = 0;
let maskTarget = 0;
let camProgress = 0;
let camTarget = 0;

let currentCam = "CAM11";

let isFlashlightOn = false;
let isLeftVentLight = false;
let isRightVentLight = false;

let hallwayEnemy = null; 
let leftVentEnemy = false; 
let rightVentEnemy = false; 

let threatTimer = 0;
let fanAngle = 0;
let isJumpscaring = false;
let jumpscareWho = "";
let jumpscareFrame = 0;
let gameOver = false;

setInterval(() => {
  if (gameOver) return;
  if (time === 12) time = 1; else time++;
  if (time === 6) {
    gameOver = true;
    document.getElementById('go-title').innerText = "🎉 SAAT 6 AM OLDU!";
    document.getElementById('go-title').style.color = "#0f0";
    document.getElementById('go-reason').innerText = "Geceyi başardın!";
    document.getElementById('game-over-screen').style.display = 'flex';
  } else {
    document.getElementById('time-text').innerText = time + " AM";
  }
}, 22000);

setInterval(() => {
  if (gameOver || isJumpscaring) return;
  if (!hallwayEnemy && !leftVentEnemy && !rightVentEnemy) {
    let r = Math.random();
    if (r < 0.4) {
      hallwayEnemy = Math.random() < 0.5 ? 'foxy' : 'bonnie';
    } else if (r < 0.7) {
      leftVentEnemy = true;
    } else {
      rightVentEnemy = true;
    }
    threatTimer = 0;
  }
}, 8000);

function gameLoop() {
  updateLogic();
  render();
  requestAnimationFrame(gameLoop);
}

function updateLogic() {
  if (gameOver) return;

  fanAngle += 0.25;

  if (maskProgress < maskTarget) {
    maskProgress = Math.min(1, maskProgress + 0.1);
  } else if (maskProgress > maskTarget) {
    maskProgress = Math.max(0, maskProgress - 0.1);
  }

  if (camProgress < camTarget) {
    camProgress = Math.min(1, camProgress + 0.1);
  } else if (camProgress > camTarget) {
    camProgress = Math.max(0, camProgress - 0.1);
  }

  if (camProgress < 0.8) {
    musicBox -= 0.06;
  }
  if (musicBox <= 0 && !isJumpscaring) {
    startJumpscare("PUPPET", "Müzik kutusu bitti ve Puppet saldırdı!");
  }

  if (isFlashlightOn && battery > 0 && maskProgress === 0 && camProgress === 0) {
    battery -= 0.08;
    if (battery < 0) battery = 0;
    updateBatteryUI();
  }

  if (hallwayEnemy || leftVentEnemy || rightVentEnemy) {
    threatTimer++;

    if (leftVentEnemy) {
      if (maskProgress > 0.8) {
        if (threatTimer > 90) { leftVentEnemy = false; threatTimer = 0; }
      } else if (threatTimer > 350) {
        startJumpscare("TOY BONNIE", "Sol havalandırmadan saldırdı!");
      }
    }

    if (rightVentEnemy) {
      if (maskProgress > 0.8) {
        if (threatTimer > 90) { rightVentEnemy = false; threatTimer = 0; }
      } else if (threatTimer > 350) {
        startJumpscare("TOY CHICA", "Sağ havalandırmadan saldırdı!");
      }
    }

    if (hallwayEnemy) {
      if (hallwayEnemy === 'foxy') {
        if (isFlashlightOn && battery > 0) {
          if (threatTimer > 40) { hallwayEnemy = null; threatTimer = 0; }
        } else if (threatTimer > 380) {
          startJumpscare("FOXY", "Foxy koridordan üzerine fırladı!");
        }
      } else {
        if (maskProgress > 0.8) {
          if (threatTimer > 100) { hallwayEnemy = null; threatTimer = 0; }
        } else if (threatTimer > 320) {
          startJumpscare("BONNIE", "Ofise giren Bonnie seni yakaladı!");
        }
      }
    }
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (isJumpscaring) {
    renderJumpscare();
    return;
  }

  renderOffice();

  if (camProgress > 0) {
    ctx.save();
    let camY = canvas.height * (1 - camProgress);
    ctx.translate(0, camY);
    renderCamera();
    ctx.restore();
  }

  if (maskProgress > 0) {
    renderMaskOverlay();
  }
}

function renderOffice() {
  ctx.fillStyle = "#1e222d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#141720"; ctx.lineWidth = 8;
  for(let x = 0; x < canvas.width; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 410); ctx.stroke();
  }

  ctx.fillStyle = "#14161f";
  ctx.fillRect(0, 410, canvas.width, 190);
  ctx.strokeStyle = "#3a4254"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 410); ctx.lineTo(canvas.width, 410); ctx.stroke();

  ctx.fillStyle = "#8b2626";
  ctx.fillRect(200, 100, 90, 110);
  ctx.fillStyle = "#ffffaa"; ctx.font = "bold 11px sans-serif";
  ctx.fillText("CELEBRATE!", 206, 120);

  ctx.fillStyle = "#08090d";
  ctx.fillRect(340, 70, 320, 340);
  ctx.strokeStyle = "#4a5366"; ctx.lineWidth = 6;
  ctx.strokeRect(340, 70, 320, 340);

  ctx.fillStyle = "#08090d";
  ctx.fillRect(20, 230, 140, 180);
  ctx.strokeStyle = "#5a6378"; ctx.lineWidth = 6;
  ctx.strokeRect(20, 230, 140, 180);

  ctx.fillStyle = "#08090d";
  ctx.fillRect(840, 230, 140, 180);
  ctx.strokeStyle = "#5a6378"; ctx.lineWidth = 6;
  ctx.strokeRect(840, 230, 140, 180);

  if (maskProgress === 0 && camProgress === 0) {
    if (isLeftVentLight) {
      ctx.fillStyle = "rgba(255, 255, 190, 0.95)";
      ctx.fillRect(23, 233, 134, 174);
      if (leftVentEnemy) {
        ctx.fillStyle = "#2288cc";
        ctx.beginPath(); ctx.arc(90, 320, 45, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(70, 240, 14, 45); ctx.fillRect(96, 240, 14, 45);
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(78, 310, 12, 0, Math.PI*2); ctx.arc(102, 310, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(78, 310, 5, 0, Math.PI*2); ctx.arc(102, 310, 5, 0, Math.PI*2); ctx.fill();
      }
    }

    if (isRightVentLight) {
      ctx.fillStyle = "rgba(255, 255, 190, 0.95)";
      ctx.fillRect(843, 233, 134, 174);
      if (rightVentEnemy) {
        ctx.fillStyle = "#eec800";
        ctx.beginPath(); ctx.arc(910, 320, 45, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ff6600"; ctx.fillRect(895, 330, 30, 15);
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(895, 310, 12, 0, Math.PI*2); ctx.arc(925, 310, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(895, 310, 5, 0, Math.PI*2); ctx.arc(925, 310, 5, 0, Math.PI*2); ctx.fill();
      }
    }

    if (isFlashlightOn && battery > 0) {
      ctx.fillStyle = "rgba(255, 255, 210, 0.92)";
      ctx.fillRect(343, 73, 314, 334);
      let gradC = ctx.createRadialGradient(500, 240, 20, 500, 240, 250);
      gradC.addColorStop(0, 'rgba(255,255,255,1)');
      gradC.addColorStop(0.6, 'rgba(255,255,180,0.6)');
      gradC.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradC; ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (hallwayEnemy) {
        if (hallwayEnemy === 'foxy') {
          ctx.fillStyle = "#aa2222"; ctx.beginPath(); ctx.arc(500, 220, 52, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = "#000"; ctx.fillRect(510, 205, 22, 18);
        } else {
          ctx.fillStyle = "#3333aa"; ctx.beginPath(); ctx.arc(500, 220, 55, 0, Math.PI*2); ctx.fill();
          ctx.fillRect(470, 120, 16, 65); ctx.fillRect(514, 120, 16, 65);
        }
      }
    }
  }

  ctx.fillStyle = "#2c221e"; ctx.fillRect(160, 420, 680, 180);
  ctx.fillStyle = "#4a3b32"; ctx.fillRect(140, 410, 720, 20);

  ctx.save();
  ctx.translate(730, 355);
  ctx.fillStyle = "#222"; ctx.fillRect(-6, 30, 12, 35);
  ctx.rotate(fanAngle);
  ctx.fillStyle = "#778899";
  ctx.fillRect(-30, -5, 60, 10); ctx.fillRect(-5, -30, 10, 60);
  ctx.restore();
}

function renderCamera() {
  ctx.fillStyle = "#05050d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`;
    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 3, 3);
  }

  ctx.fillStyle = "#222"; ctx.fillRect(0, 0, canvas.width, 15);

  ctx.fillStyle = "#0088ff"; ctx.font = "bold 22px Courier";
  ctx.fillText("[" + currentCam + "]", 40, 50);

  if (currentCam === "CAM11") {
    ctx.fillStyle = "#fff"; ctx.font = "bold 16px Courier";
    ctx.fillText("PRIZE CORNER - PUPPET", 40, 80);

    ctx.strokeStyle = "#0088ff"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(500, 290, 85, 0, Math.PI*2); ctx.stroke();
    
    ctx.fillStyle = "#0088ff";
    ctx.beginPath(); ctx.arc(500, 290, Math.max(0, (musicBox/100)*80), 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = "#fff"; ctx.font = "bold 18px Courier"; ctx.textAlign = "center";
    ctx.fillText(`MÜZİK KUTUSU: %${Math.floor(musicBox)}`, 500, 290);
    ctx.fillText("KURMAK İÇİN TIKLA / BASILI TUT", 500, 420);
    ctx.textAlign = "left";
  } else {
    ctx.fillStyle = "#aaa"; ctx.font = "bold 20px Courier";
    ctx.fillText("Kamera görüntüsü aktarılıyor...", 340, 290);
  }

  ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(710, 310, 260, 250);
  ctx.strokeStyle = "#556"; ctx.strokeRect(710, 310, 260, 250);

  const cams = [
    {id: "CAM11", x: 810, y: 340},
    {id: "CAM01", x: 740, y: 400},
    {id: "CAM02", x: 880, y: 400},
    {id: "CAM03", x: 810, y: 470}
  ];

  cams.forEach(c => {
    ctx.fillStyle = currentCam === c.id ? "#00ff00" : "#333";
    ctx.fillRect(c.x, c.y, 65, 32);
    ctx.fillStyle = currentCam === c.id ? "#000" : "#fff";
    ctx.font = "bold 12px Courier";
    ctx.fillText(c.id, c.x + 8, c.y + 20);
  });
}

function renderMaskOverlay() {
  ctx.save();
  let maskY = -canvas.height * (1 - maskProgress);
  ctx.translate(0, maskY);

  ctx.fillStyle = "rgba(25, 12, 6, 0.94)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.ellipse(330, 280, 135, 90, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(670, 280, 135, 90, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.strokeStyle = "#1b0a04"; ctx.lineWidth = 40;
  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  ctx.restore();
}

function startJumpscare(who, reason) {
  isJumpscaring = true;
  jumpscareWho = who;
  jumpscareFrame = 0;
  
  let jsInterval = setInterval(() => {
    jumpscareFrame++;
    if (jumpscareFrame > 30) {
      clearInterval(jsInterval);
      gameOver = true;
      document.getElementById('go-title').innerText = "😱 " + jumpscareWho + " JUMPSCARE!";
      document.getElementById('go-reason').innerText = reason;
      document.getElementById('game-over-screen').style.display = 'flex';
    }
  }, 40);
}

function renderJumpscare() {
  let shakeX = (Math.random() - 0.5) * 35;
  let shakeY = (Math.random() - 0.5) * 35;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.fillStyle = jumpscareFrame % 2 === 0 ? "#b00" : "#000";
  ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);

  let scale = 1 + (jumpscareFrame * 0.1);
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(scale, scale);

  ctx.fillStyle = jumpscareWho === 'PUPPET' ? '#eee' : '#700';
  ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(-40, -30, 28, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(40, -30, 28, 0, Math.PI*2); ctx.fill();
  
  ctx.fillStyle = "#f00";
  ctx.beginPath(); ctx.arc(-40, -30, 9, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(40, -30, 9, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = "#000"; ctx.fillRect(-55, 20, 110, 50);
  ctx.fillStyle = "#fff";
  for(let i = -50; i < 50; i += 15) {
    ctx.beginPath(); ctx.moveTo(i, 20); ctx.lineTo(i+7, 38); ctx.lineTo(i+14, 20); ctx.fill();
  }

  ctx.restore();
}

function updateBatteryUI() {
  let segs = document.getElementById('battery-bar').children;
  let count = Math.ceil(battery / 25);
  for (let i = 0; i < 4; i++) segs[i].style.opacity = i < count ? "1" : "0.1";
}

function bindLightButton(btn, setLight) {
  const start = (e) => { e.preventDefault(); setLight(true); btn.classList.add('active'); };
  const end = (e) => { e.preventDefault(); setLight(false); btn.classList.remove('active'); };

  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointerleave', end);
  btn.addEventListener('pointercancel', end);
}

bindLightButton(document.getElementById('btn-flash-center'), (v) => {
  if (maskProgress === 0 && camProgress === 0) isFlashlightOn = v;
});
bindLightButton(document.getElementById('btn-left-vent'), (v) => isLeftVentLight = v);
bindLightButton(document.getElementById('btn-right-vent'), (v) => isRightVentLight = v);

document.getElementById('bar-mask').addEventListener('click', () => {
  if (camTarget > 0 || gameOver) return;
  maskTarget = maskTarget === 0 ? 1 : 0;
});

document.getElementById('bar-camera').addEventListener('click', () => {
  if (maskTarget > 0 || gameOver) return;
  camTarget = camTarget === 0 ? 1 : 0;
});

canvas.addEventListener('pointerdown', (e) => {
  if (gameOver || camProgress < 0.9) return;
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (canvas.width / rect.width);
  let y = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (x > 710 && y > 310) {
    if (x > 810 && x < 875 && y > 340 && y < 372) currentCam = "CAM11";
    if (x > 740 && x < 805 && y > 400 && y < 432) currentCam = "CAM01";
    if (x > 880 && x < 945 && y > 400 && y < 432) currentCamN = "CAM02"; // Fix typo reference safely
    if (x > 880 && x < 945 && y > 400 && y < 432) currentCam = "CAM02";
    if (x > 810 && x < 875 && y > 470 && y < 502) currentCam = "CAM03";
  }
  if (currentCam === "CAM11" && x > 415 && x < 585 && y > 205 && y < 375) {
    musicBox = Math.min(100, musicBox + 25);
  }
});

window.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (e.code === 'ControlLeft' || e.key === 'f' || e.key === 'F') {
    if (maskProgress === 0 && camProgress === 0) isFlashlightOn = true;
  }
  if (e.code === 'Space') {
    if (camTarget === 0) maskTarget = maskTarget === 0 ? 1 : 0;
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ControlLeft' || e.key === 'f' || e.key === 'F') isFlashlightOn = false;
});

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
